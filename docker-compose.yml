version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/sitecare.db
      - CRAWL_MAX_PAGES=10
      - REQUEST_TIMEOUT=15
    volumes:
      - sitecare_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sitecare_data:
